[project]
name = "wikiagent"
version = "0.1.0"
description = "A Claude agent that answers questions using Wikipedia, plus an eval suite."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wikiagent = "wikiagent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits the live Wikipedia API (run with WIKIAGENT_NETWORK=1)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikiagent"]
